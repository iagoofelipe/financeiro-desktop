<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/deps/bootstrap/css/bootstrap.min.css">
    
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/home.css">
</head>

<body>
    <main class="d-flex flex-column">
        <div class="card d-flex flex-row p-3 mb-3 home-card-top justify-content-between">
            <div class="d-flex flex-row column-gap-3 align-items-center">
                <button class="btn border-0 p-0" id="btn-home-menu" type="button" data-bs-toggle="offcanvas" data-bs-target="#nav-aside" aria-controls="nav-aside"><div class="replace" url="/imgs/icons/list.svg"></div></button>
                <p class="title m-0" id="home-title"></p>
            </div>
            <div class="d-flex flex-row column-gap-3 align-items-center">
                <span id="last-update" class="title-3"></span>
                <button id="btn-sync" title="atualizar dados" class="btn btn-outline"><div class="replace" url="/imgs/icons/arrow-repeat.svg"></div></button>
                <button id="btn-theme" title="alterar tema claro/escuro" class="btn btn-outline"><div class="replace" url="/imgs/icons/sun-fill.svg"></div></button>
                <div id="home-navtop"></div>
                <input type="month" class="form-control w-auto" id="filter-month-year" title="período de referência" connection-trigger>
            </div>
        </div>
        <div id="home-content" class="h-100 overflow-auto"></div>
    </main>

    <!-- SIDE-NAV -->
    <div class="offcanvas offcanvas-start home-nav" tabindex="-1" id="nav-aside">
        <div class="offcanvas-body d-flex flex-column">
            <div class="d-flex align-items-center justify-content-center">
                <div class="home-nav-logo d-flex align-items-center">
                    <img src="/imgs/logo.svg" alt="logo" class="me-2">
                    <p class="mb-0 home-nav-title">Financeiro</p>
                </div>
                <button class="btn close" type="button" data-bs-dismiss="offcanvas" aria-label="Close">
                    <div title="recolher painel">
                        <div class="replace" url="/imgs/icons/panel-left-filled.svg"></div>
                    </div>
                </button>
            </div>
            <hr class="h-line-ignore-parent-padding">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="mb-1">
                    <a class="nav-link d-flex align-items-center" name="Dashboards">
                        <div class="replace" url="/imgs/icons/dashboard.svg"></div>
                        <span class="ms-2">Dashboards</span>
                    </a>
                </li>
                <li class="mb-1">
                    <a class="nav-link d-flex align-items-center" name="Registros">
                        <div class="replace" url="/imgs/icons/table.svg"></div>
                        <span class="ms-2">Registros</span>
                    </a>
                </li>
                <li class="mb-1">
                    <a class="nav-link d-flex align-items-center" name="Cartões e Faturas">
                        <div class="replace" url="/imgs/icons/credit-card.svg"></div>
                        <span class="ms-2">Cartões e Faturas</span>
                    </a>
                </li>
            </ul>
            <hr class="h-line-ignore-parent-padding">
            <ul class="nav nav-pills flex-column">
                <li class="mb-1">
                    <a class="nav-link d-flex align-items-center" name="Configurações">
                        <div class="replace" url="/imgs/icons/gear-fill.svg"></div>
                        <span class="ms-2">Configurações</span>
                    </a>
                </li>
                <li class="mb-1">
                    <a class="nav-link d-flex align-items-center" name="Usuário e Conta">
                        <div class="replace" url="/imgs/icons/person-fill.svg"></div>
                        <span class="ms-2 user-full-name"></span>
                    </a>
                </li>
                <li>
                    <a class="nav-link d-flex align-items-center" name="Sair">
                        <div class="replace" url="/imgs/icons/logout.svg"></div>
                        <span class="ms-2">Sair</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto toast-title">Financeiro</strong>
                <small class="toast-subtitle"></small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body"></div>
        </div>
    </div>
</body>

<script src="/deps/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/deps/jquery-4.0.0.min.js"></script>
<script src="/deps/chart.js"></script>
<script type="module" src="/scripts/base.js"></script>
<script type="module" src="/scripts/home.js"></script>

</html>
