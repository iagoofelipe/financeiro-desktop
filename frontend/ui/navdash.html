<div class="container-dash d-flex flex-column row-gap-3 h-100">
    <div class="top-cards card">
        <div class="d-flex justify-content-evenly content overflow-x-auto p-3">
            <div class="d-flex">
                <img src="/imgs/money-in.svg">
                <div class="ms-2 d-flex flex-column justify-content-center" style="width: 260px;">
                    <span class="title-3-bold">Entradas</span>
                    <div>
                        <span class="title-3-bold">R$</span>
                        <span class="title value-in"></span>
                    </div>
                    <div class="value-in-note">
                        <img src="/imgs/icons/progress-down-red.svg" class="icon-not-progress" hidden>
                        <img src="/imgs/icons/progress-up-green.svg" class="icon-progress" hidden>
                        <span class="title-3-bold text"></span>
                    </div>
                </div>
            </div>
            <div class="d-flex">
                <img src="/imgs/money-out.svg">
                <div class="ms-2 d-flex flex-column justify-content-center" style="width: 260px;">
                    <span class="title-3-bold">Saídas</span>
                    <div>
                        <span class="title-3-bold">R$</span>
                        <span class="title value-out"></span>
                    </div>
                    <div class="value-out-note">
                        <img src="/imgs/icons/progress-up-red.svg" class="icon-not-progress" hidden>
                        <img src="/imgs/icons/progress-down-green.svg" class="icon-progress" hidden>
                        <span class="title-3-bold text"></span>
                    </div>
                </div>
            </div>
            <div class="d-flex">
                <img src="/imgs/balance.svg">
                <div class="ms-2 d-flex flex-column justify-content-center" style="width: 140px;">
                    <span class="title-3-bold">Saldo</span>
                    <div>
                        <span class="title-3-bold">R$</span>
                        <span class="title value-balance"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row-gap-3 d-flex column-gap-3 h-100">
        <div id="chart-category" class="w-50"></div>
        <div class="card p-3 row-gap-3 w-50">
            <div class="d-flex flex-row align-items-center justify-content-between">
                <span class="title">Cartões</span>
                <select class="form-select w-auto select-card" connection-trigger></select>
            </div>
            <div class="field-card-accounted">
                <p class="m-0 fw-semibold">Valores Contabilizados</p>
                <span class="text">-</span>
            </div>
            <div class="field-card-pending">
                <p class="m-0 fw-semibold">Lançamentos Pendentes</p>
                <span class="text">-</span>
            </div>
            <div class="field-card-closing-date">
                <p class="m-0 fw-semibold">Fechamento</p>
                <span class="text">-</span>
            </div>
            <div class="field-card-due-date">
                <p class="m-0 fw-semibold">Vencimento</p>
                <span class="text">-</span>
            </div>
        </div>
    </div>

    <div class="card p-3 h-100">
        <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex">
                <span class="title pe-2">Transações</span>
                <p class="p-1 m-0 text-center" id="num-transactions" style="background-color: var(--bs-border-color); border-radius: 50%; min-width: 29px;">0</p>
            </div>
            <select class="form form-select w-auto" id="filter-transaction" title="Tipo" connection-trigger>
                <option value="" hidden>Tipo</option>
                <option value="in">Entrada</option>
                <option value="out" selected>Saída</option>
            </select>
            <div class="input-group flex-nowrap w-auto" id="filter-transaction-group">
                <select class="form form-select w-auto" title="Cartões" connection-trigger>
                    <option value="in">Entrada</option>
                    <option value="out" selected>Saída</option>
                </select>
                <div class="input-group-text p-0 ps-2 pe-2">
                    <button type="button" class="btn-close" aria-label="Close" id="btn-filter-transaction-group" connection-trigger></button>
                </div>
            </div>
        </div>
        <div id="container-transactions-content" class="overflow-auto mt-3"></div>
    </div>
</div>
